[package]
name = "research-hotspots-desktop"
version = "0.22.0-beta.3"
description = "Local-first research hotspot analysis and scientific literature exploration desktop application"
authors = ["Research Hotspots Desktop"]
edition = "2021"
default-run = "research-hotspots-desktop"
autobins = false

[features]
default = ["desktop-dialog"]
desktop-dialog = ["dep:tauri-plugin-dialog"]
dev-tools = []

[[bin]]
name = "research-hotspots-desktop"
path = "src/main.rs"

[[bin]]
name = "audit_library"
path = "src/bin/audit_library.rs"
required-features = ["dev-tools"]

[[bin]]
name = "export_app17_visual_review"
path = "src/bin/export_app17_visual_review.rs"
required-features = ["dev-tools"]

[[bin]]
name = "export_hotspot_evidence"
path = "src/bin/export_hotspot_evidence.rs"
required-features = ["dev-tools"]

[[bin]]
name = "export_star_map"
path = "src/bin/export_star_map.rs"
required-features = ["dev-tools"]

[[bin]]
name = "import_library"
path = "src/bin/import_library.rs"
required-features = ["dev-tools"]

[[bin]]
name = "prepare_default_library"
path = "src/bin/prepare_default_library.rs"
required-features = ["dev-tools"]

[[bin]]
name = "audit_windows_first_run"
path = "src/bin/audit_windows_first_run.rs"
required-features = ["dev-tools"]

[[bin]]
name = "audit_agent_persistence"
path = "src/bin/audit_agent_persistence.rs"
required-features = ["dev-tools"]

[[bin]]
name = "audit_agent_executor"
path = "src/bin/audit_agent_executor.rs"
required-features = ["dev-tools"]

[[bin]]
name = "audit_agent_live"
path = "src/bin/audit_agent_live.rs"
required-features = ["dev-tools"]

[[bin]]
name = "audit_agent_performance"
path = "src/bin/audit_agent_performance.rs"
required-features = ["dev-tools"]

[[bin]]
name = "audit_semantic_embedding_runtime"
path = "src/bin/audit_semantic_embedding_runtime.rs"
required-features = ["dev-tools"]

[[bin]]
name = "audit_galaxy_semantic_layout"
path = "src/bin/audit_galaxy_semantic_layout.rs"
required-features = ["dev-tools"]

[[bin]]
name = "audit_agent_immersive_background"
path = "src/bin/audit_agent_immersive_background.rs"
required-features = ["dev-tools"]

[[bin]]
name = "audit_sidera_pi_rag"
path = "src/bin/audit_sidera_pi_rag.rs"
required-features = ["dev-tools"]

[[bin]]
name = "audit_document_ocr_runtime"
path = "src/bin/audit_document_ocr_runtime.rs"
required-features = ["dev-tools"]

[[bin]]
name = "rebuild_semantic_galaxy_snapshot"
path = "src/bin/rebuild_semantic_galaxy_snapshot.rs"
required-features = ["dev-tools"]

[lib]
name = "research_hotspots_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false

[workspace]
members = ["core", "conversation-store-test-harness", "windows-test-host-smoke"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
sha2 = "0.10"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
fastembed = { version = "5.17.3", default-features = false, features = ["ort-download-binaries-rustls-tls", "directml"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["download-binaries", "tls-rustls", "directml"] }
research-hotspots-core = { path = "core" }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp"] }
webview2-com = "0.38"
windows-core = "0.61"
