version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: research_hotspots_mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepresearch_streamlit
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      CHROME_DRIVER_PATH: /usr/bin/chromedriver
      FONT_PATH: /app/assets/fonts/SIMHEI.ttf
      MERMAID_JS_PATH: /app/assets/js/mermaid.min.js
      EXPORT_DIR: /app/data/exports
      PYTHONUNBUFFERED: "1"
    ports:
      - "8501:8501"
    volumes:
      - ./data/exports:/app/data/exports
    command: >
      streamlit run app17.py --server.address=0.0.0.0 --server.port=8501

volumes:
  mysql_data:
