[package]
name = "research-hotspots-desktop"
version = "0.20.0"
description = "Research hotspots desktop workstation"
authors = ["local"]
edition = "2021"
default-run = "research-hotspots-desktop"

[lib]
name = "research_hotspots_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
